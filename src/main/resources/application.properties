# To improve the performance during development. 
# For more information https://vaadin.com/docs/v14/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
# vaadin.whitelisted-packages= org/vaadin/example

# This allows to disable requests at startup. They then first have to be enabled via the UI:
#StartupWithHaltedRequests=false
StartupWithHaltedRequests=true
# Requests should be sent asynchronously in the background thereby not blocking the GUI thread:
LeafNode.AsyncRequests=true
# If something is not working enabling more verbose log entries (plus stacktrace) of failing requests 
# may help to identify the issue. But normally one is not interested in such detailed info...
LeafNode.ShortRequestLogEntries=true
#LeafNode.ShortRequestLogEntries=false

# for some odd reason Java does not use the same separators as defined in the OS' settings (at least on WIndows 10) ||-(
# so we allow to override this, if necessary:
DigitGroupingSeparator='
DecimalSeparator=.

# See https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html for the applicable codes:
LocalDateTimeStamp.Format=yyyy-MM-dd HH:mm:ss.SS

# Keystore used by application to connect to other systems:
KeyStoreType=pkcs12
KeyStorePath=keystore.p12
KeyStorePassword=password

# Truststore used by application
TrustStoreType=pkcs12
TrustStorePath=truststore.p12
TrustStorePassword=changeit

# Do we trust all certificates without checking?
TrustAllCertificates=true
# speeds up things a bit:
DisableHostnameVerification=true
jdk.httpclient.allowRestrictedHeaders=host,connection

# We enable ALL SSL and TLS protocol versions. We only want to connect and *monitor*
# those systems not impose any new requirements (e.g. on our old dev-environments):
# Format: comma-separated list of: TLSv1,TLSv1.1,TLSv1.2,TLSv1.3,SSLv3
SupportedSslVersions=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

NodeView.alwaysSaveAfterEdit=false
NodeForm.ClearButtonsVisible=true
# how much of the description is shown in the overview panel
NodeForm.MaxDescriptionLength=100

# Threshold for action check - comma-separated values for Failed,Degraded,OK:
ActionCheck.DefaultThresholdValues=5,3,2

# default DB driver (not for our own DB but for outgoing JDBC connections):
JDBC.DriverName.Default=oracle.jdbc.driver.OracleDriver
JDBC.ResultSet.Row.Separator=\n
JDBC.ResultSet.Col.Separator=\t
JDBC.ResultSet.NrRresults=#results: {}
JDBC.ResultSet.NoRresults=no results

# settings for HTTPS connection attempts:
#HttpAuthRetryLimit: same as setting: "jdk.httpclient.auth.retrylimit" (default is 3)
HttpAuthRetryLimit=5
#HttpRedirectsRetryLimit: same as setting "jdk.httpclient.redirects.retrylimit" (default is 5)
HttpRedirectsRetryLimit=7

SendMailAction.mailHost=smtp.elcaDev.local
SendMailAction.mailPort=25
SendMailAction.mailProtocol=smtp
SendMailAction.mailUser=anonymous
SendMailAction.mailPwd=ksta-zh-tools.elcadev.local
SendMailAction.auth=false
SendMailAction.starttls=false
SendMailAction.debug=false

SendMailForm.To.Default=michael.moser@elca.ch
SendMailForm.Cc.Default=
SendMailForm.From.Default=ksta-zh-tools.elcadev.local
