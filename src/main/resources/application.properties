# server.port=${PORT:8443}
server.port=${PORT:8085}
server.ssl.enabled=true
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2
# keystore to be used for Web-Interface:
server.ssl.key-store=keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=password
server.ssl.key-alias=ksta-zh-tools.elcadev.local

# Ensure application is run in Vaadin 14/npm mode
vaadin.compatibilityMode=false
vaadin.whitelisted-packages=net/mmo/utils/kism
logging.level.org.atmosphere=warn
#logging.level.org.springframework.web=DEBUG

# files to open:
config.files=home.kmc

# default config file name and type (when creating new files):
config_dflt_name=new
config_dflt_type=kmc

# This allows to override the system settings:
# de_CH is not supported :-(
Locale=de

# User mgmt: (TODO: this should be handled via some vault)
# first list: a comma-separated list of all user:role-tuples (supported roles are "READ_ONLY" and "ADMIN")
user.names=mms:ADMIN,mmo:ADMIN,user:READ_ONLY
# second list: the passwords for the above users
user.pwd.mms=mysecret
user.pwd.mmo=mysecret
user.pwd.user=password

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
# settings for in-memory DB H2:
spring.datasource.driverClassName=org.h2.Driver
# Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# == settings for DB H2:
# -- variant 1: temporary in-memory data storage:
#spring.datasource.url=jdbc:h2:mem:testdb
# -- variant 2: using persistent data storage at a specific filesystem location:
# in user's home directory:
spring.datasource.url=jdbc:h2:file:./data/monitoring
# in a specific location:
#spring.datasource.url=jdbc:h2:file:U:/data/monitoring
# -- variant 3: using a local DB server:
# data in a specific location:
#spring.datasource.url=jdbc:h2:tcp://localhost/U:/Documents/eclipse/workspace_Vaadin/KIS-Monitoring/data/monitoring;AUTO_SERVER=TRUE
# data in user's home directory:
#spring.datasource.url=jdbc:h2:tcp://localhost/data/monitoring;AUTO_SERVER=TRUE
spring.datasource.username=kismon
spring.datasource.password=kismon
# values are always/embedded/never:
spring.datasource.initialization-mode=always
# H2 Console:
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# end of H2 settings

